[package]
name = "vento-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
log = "0.4"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "9", default-features = false, features = ["aes-crypto", "deflate", "deflate64", "bzip2", "lzma", "zstd", "time"] }

[dev-dependencies]
tempfile = "3"
