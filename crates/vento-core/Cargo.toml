[package]
name = "vento-core"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
log = "0.4"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "9", default-features = false, features = ["aes-crypto", "deflate", "deflate64", "bzip2", "lzma", "zstd", "time"] }
fs4 = "1"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "bzip2", "ppmd"] }
rars = { version = "0.11", default-features = false, features = ["encryption"] }
zeroize = "1"
percent-encoding = "2"
imagesize = "0.15"
sys-locale = "0.3"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

# Flushing saves without emptying the drive cache (see `durable`).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "bzip2", "ppmd", "compress"] }
rars = { version = "0.11", default-features = false, features = ["encryption", "write"] }
