[package]
name = "vento-platform"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[dependencies]
vento-core = { path = "../vento-core" }
thiserror = "2"
log = "0.4"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Already in the tree through objc2-app-kit; needed to hand AppKit a block.
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSURL",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSValue",
    "NSRunLoop",
    "NSFileManager",
    "NSError",
    "NSNotification",
    "NSBundle",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSScreen",
    "NSApplication",
    "NSRunningApplication",
    "NSResponder",
    "NSWorkspace",
    "NSImage",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSGraphicsContext",
    "NSGraphics",
    "NSWindow",
    "NSView",
    "NSPanel",
    "NSDragging",
    "NSColor",
    "NSMenu",
    "NSMenuItem",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGEventSource",
    "CGImage",
    "CGColorSpace",
    "CGContext",
    "CGBitmapContext",
] }
objc2-core-foundation = { version = "0.3", features = [
    "CFURL",
    "CFDictionary",
    "CFString",
    "CFNumber",
    "CFData",
] }
# Reads and writes image files for the Convert action.
objc2-image-io = { version = "0.3", features = [
    "CGImageSource",
    "CGImageDestination",
    "CGImageProperties",
] }
rfd = "0.17"
# Reads and copies the quarantine attribute of extracted files.
xattr = "1"

[dev-dependencies]
# Writes the PNG files the picture thumbnail tests read.
png = "0.18"
tempfile = "3"
