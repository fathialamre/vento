[package]
name = "vento-platform"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[dependencies]
vento-core = { path = "../vento-core" }
thiserror = "2"
log = "0.4"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Already in the tree through objc2-app-kit; needed to hand AppKit a block.
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSURL",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSValue",
    "NSRunLoop",
    "NSFileManager",
    "NSError",
    "NSNotification",
    "NSBundle",
    "NSProcessInfo",
    # The PDF backend hands PDFKit a source's bytes without copying them.
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSScreen",
    "NSApplication",
    "NSRunningApplication",
    "NSResponder",
    "NSWorkspace",
    "NSImage",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSGraphicsContext",
    "NSGraphics",
    "NSWindow",
    "NSView",
    "NSPanel",
    "NSDragging",
    "NSColor",
    "NSMenu",
    "NSMenuItem",
    # A menu laid out right to left in Arabic.
    "NSUserInterfaceLayout",
    # The Copy from screen overlay: its crosshair, the selection's border,
    # and the crosshair on screens whose panel is not key.
    "NSCursor",
    "NSBezierPath",
    "NSTrackingArea",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGEventSource",
    "CGImage",
    "CGWindow",
    "CGColorSpace",
    "CGContext",
    "CGBitmapContext",
    # The PDF tests draw their fixture documents.
    "CGPDFContext",
    "CGDataConsumer",
] }
# Holds on to the CGImage a screen capture hands back, and carries the
# Convert action's file URLs and image properties.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFURL",
    "CFDictionary",
    "CFString",
    "CFNumber",
    "CFData",
] }
# Copy from screen: capture an area, then read its text. Only what that needs;
# every class is looked up at run time, so the app still starts on macOS 13.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "SCShareableContent",
    "SCStream",
    "SCScreenshotManager",
] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "VNRequest",
    "VNRecognizeTextRequest",
    "VNObservation",
    "VNRequestHandler",
] }
# Reads and writes image files for the Convert action.
objc2-image-io = { version = "0.3", features = [
    "CGImageSource",
    "CGImageDestination",
    "CGImageProperties",
] }
# Opens, writes and draws PDF pages for the PDF action.
objc2-pdf-kit = { version = "0.3", default-features = false, features = [
    "std",
    "PDFDocument",
    "PDFPage",
    "objc2-core-graphics",
    "objc2-app-kit",
] }
# Encodes WebP for the Convert action; ImageIO reads WebP but can't write it.
# Builds the bundled C library with cc (no bindgen by default).
libwebp-sys = "0.14"
rfd = "0.17"
# Reads and copies the quarantine attribute of extracted files.
xattr = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.22"
gio-unix = "0.22"
# Both already in the app through Slint (image with PNG and JPEG); TIFF is
# added for pictures copied only as TIFF, which the clipboard history shows,
# and GIF, BMP and WebP (read only) for the Convert action.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "bmp", "webp"] }
# Writes lossy WebP for the Convert action, as on the Mac (`webp.rs`).
libwebp-sys = "0.14"
# Reads and writes HEIC for the Convert action through the system libheif
# (LGPL-3.0; `libheif-dev` to build). Built against 1.17's API, which is all
# Vento uses, so it builds on Ubuntu 24.04 (CI) and runs on newer libheif.
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
resvg = { version = "0.48", default-features = false }
# Already in the app through winit; our own connection for vento's windows.
x11rb = { version = "0.13", features = ["shape"] }
# Hears SIGTERM (GNOME ending the session), SIGINT and SIGHUP on a thread,
# so vento can tidy up on its main thread before it goes.
signal-hook = "0.3"

[dev-dependencies]
# The probe example prints the platform's logs (`RUST_LOG=debug`).
env_logger = "0.11"
# Writes the PNG files the picture thumbnail tests read.
png = "0.18"
tempfile = "3"
