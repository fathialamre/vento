[package]
name = "vento-platform"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[dependencies]
vento-core = { path = "../vento-core" }
thiserror = "2"
log = "0.4"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Already in the tree through objc2-app-kit; needed to hand AppKit a block.
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSURL",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSValue",
    "NSRunLoop",
    "NSFileManager",
    "NSError",
    "NSNotification",
    "NSBundle",
    "NSProcessInfo",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSScreen",
    "NSApplication",
    "NSRunningApplication",
    "NSResponder",
    "NSWorkspace",
    "NSImage",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSGraphicsContext",
    "NSGraphics",
    "NSWindow",
    "NSView",
    "NSPanel",
    "NSDragging",
    "NSColor",
    "NSMenu",
    "NSMenuItem",
    # The Copy from screen overlay: its crosshair, the selection's border,
    # and the crosshair on screens whose panel is not key.
    "NSCursor",
    "NSBezierPath",
    "NSTrackingArea",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGEventSource",
    "CGImage",
    "CGWindow",
    "CGColorSpace",
    "CGContext",
    "CGBitmapContext",
] }
# Holds on to the CGImage a screen capture hands back, and carries the
# Convert action's file URLs and image properties.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFURL",
    "CFDictionary",
    "CFString",
    "CFNumber",
    "CFData",
] }
# Copy from screen: capture an area, then read its text. Only what that needs;
# every class is looked up at run time, so the app still starts on macOS 13.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "SCShareableContent",
    "SCStream",
    "SCScreenshotManager",
] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "VNRequest",
    "VNRecognizeTextRequest",
    "VNObservation",
    "VNRequestHandler",
] }
# Reads and writes image files for the Convert action.
objc2-image-io = { version = "0.3", features = [
    "CGImageSource",
    "CGImageDestination",
    "CGImageProperties",
] }
# Encodes WebP for the Convert action; ImageIO reads WebP but can't write it.
# Builds the bundled C library with cc (no bindgen by default).
libwebp-sys = "0.14"
rfd = "0.17"
# Reads and copies the quarantine attribute of extracted files.
xattr = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.22"
gio-unix = "0.22"
# Both already in the app through Slint (image with PNG and JPEG), so file
# icons and picture thumbnails add no code size.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.48", default-features = false }
# Already in the app through winit; our own connection for vento's windows.
x11rb = "0.13"

[dev-dependencies]
# The probe example prints the platform's logs (`RUST_LOG=debug`).
env_logger = "0.11"
# Writes the PNG files the picture thumbnail tests read.
png = "0.18"
tempfile = "3"
