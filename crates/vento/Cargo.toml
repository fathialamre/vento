[package]
name = "vento"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"
build = "build.rs"

[[bin]]
name = "vento"
path = "src/main.rs"

[dependencies]
# Skia draws through Metal: about half the memory of the default FemtoVG on
# OpenGL, and less work at startup. The default features are left out so
# FemtoVG and the software renderer are not built in.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia",
    "accessibility",
    "compat-1-2",
    "unstable-winit-030",
    "raw-window-handle-06",
] }
vento-core = { path = "../vento-core" }
vento-platform = { path = "../vento-platform" }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26"
raw-window-handle = "0.6"
global-hotkey = "0.9"
drag = "2.1.1"
png = "0.18"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
