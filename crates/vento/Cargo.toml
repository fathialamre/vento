[package]
name = "vento"
version = "0.3.0"
edition = "2024"
description = "A wheel of actions under the cursor for the files you drag"
license = "GPL-3.0-only"
rust-version = "1.93"
build = "build.rs"

[[bin]]
name = "vento"
path = "src/main.rs"

[dependencies]
# The software renderer draws on the CPU. Any GPU renderer (FemtoVG on
# OpenGL, Skia on Metal) makes macOS hold 150-250 MB of graphics memory for
# a second or two each time a window starts drawing again, such as on every
# hover of the Pocket island; vento's windows are small enough to draw on
# the CPU instead. The default features are left out so no GPU renderer is
# built in. Transparency needs the softbuffer patch in the root Cargo.toml.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "unstable-winit-030",
    "raw-window-handle-06",
] }
vento-core = { path = "../vento-core" }
vento-platform = { path = "../vento-platform" }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.18.1"

# The icon and version of vento.exe, through the Windows SDK's rc.exe.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
raw-window-handle = "0.6"
png = "0.18"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

# The tray icon, global shortcuts and the Pocket's drag out as on the Mac;
# all three crates speak Win32.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
global-hotkey = "0.9"
drag = "2.1.1"
# The self-update check and download (the only networking in the app),
# through Windows' own TLS and certificate store: rustls' ring needs clang
# to build for ARM64.
ureq = { version = "3", default-features = false, features = ["gzip", "native-tls-no-default"] }
# The update watcher waits for a process to end and kills a copy that does
# not start. Already in the app through winit.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The tray as a StatusNotifierItem, on the zbus and async-io the app already
# has through Slint.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26"
global-hotkey = "0.9"
drag = "2.1.1"
# The self-update check and download (the only networking in the app).
ureq = "3"
# The update watcher asks whether a pid is still running and kills a copy
# that does not start.
libc = "0.2"

# The Ubuntu package (`cargo deb -p vento`), built on the oldest Ubuntu it
# supports (24.04) so its glibc and libraries are there on every later one.
# `$auto` adds the shared libraries the binary links; the rest are run time
# needs: libxkbcommon-x11 (loaded by winit), GNOME Shell for the extension,
# gnome-session-inhibit for Keep Awake, and Tesseract and libheif's codecs
# for Copy from screen and HEIC, which work without them.
[package.metadata.deb]
name = "vento"
maintainer = "Fathi Alamre <fathialamre90@gmail.com>"
copyright = "Fathi Alamre"
section = "utils"
priority = "optional"
extended-description = """\
Drag files and hold a key to open a wheel of actions under the cursor: move, \
copy, convert, archive, open a terminal and more. Vento also keeps a Pocket \
for files and text, a clipboard history and Keep Awake. Runs on GNOME \
46 to 50 through its own GNOME Shell extension, which it turns on itself; \
log out and back in once after installing."""
depends = "$auto, libxkbcommon-x11-0, gnome-shell (>= 46), gnome-session-bin"
recommends = "tesseract-ocr, tesseract-ocr-ara, tesseract-ocr-eng, libheif-plugin-libde265, libheif-plugin-x265"
assets = [
    ["target/release/vento", "usr/bin/", "755"],
    ["assets/io.github.fathialamre.Vento.desktop", "usr/share/applications/", "644"],
    # Started at login for every user, who can turn it off among the startup apps.
    ["assets/io.github.fathialamre.Vento.desktop", "etc/xdg/autostart/", "644"],
    ["assets/vento.svg", "usr/share/icons/hicolor/scalable/apps/io.github.fathialamre.Vento.svg", "644"],
    ["../../gnome-shell/vento@fathialamre.github.io/*", "usr/share/gnome-shell/extensions/vento@fathialamre.github.io/", "644"],
    ["../../LICENSE", "usr/share/doc/vento/", "644"],
    # Made by scripts/release-linux.sh.
    ["../../target/deb-notices/*", "usr/share/doc/vento/", "644"],
]
